[workspace]
resolver = "2"
members = [
    "crates/prismsurvey-core",
    "crates/prismsurvey-import",
    "crates/prismsurvey-docx",
    "crates/prismsurvey-detect",
    "crates/prismsurvey-api",
    "crates/prismsurvey-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "Apache-2.0"
authors = ["Prism Survey contributors"]

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
regex = "1.13.1"
quick-xml = "0.41.0"
zip = { version = "9.6.1", default-features = false, features = ["deflate"] }
cfb = "0.14.0"
encoding_rs = "0.8.44"
uuid = { version = "1.29.3", features = ["v4"] }
tempfile = "3.27.0"
pdf-extract = "0.12.1"
hayro = "0.9.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "bmp"] }

[profile.release]
lto = "thin"
codegen-units = 1
