[package]
name = "prismsurvey-api"
description = "The command layer the Prism Survey window talks to: one call(cmd, args) shared by the window and the tests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
prismsurvey-core = { path = "../prismsurvey-core" }
prismsurvey-import = { path = "../prismsurvey-import" }
prismsurvey-docx = { path = "../prismsurvey-docx" }
prismsurvey-detect = { path = "../prismsurvey-detect" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
